server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Browser and API share one origin, so the session cookie needs no CORS or CSRF setup.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths fall back to index.html so vue-router can handle them.
  location / {
    try_files $uri /index.html;
  }
}
